<!DOCTYPE html>
<html>
<head>
<title>BBScanner AI Hunter</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
body {
    margin:0;
    background:#0b0f1a;
    color:#e2e8f0;
    font-family:'Inter', sans-serif;
}

/* NAV */
.nav {
    padding:15px 25px;
    background:#020617;
    border-bottom:1px solid #1e293b;
}

.nav h1 { color:#22c55e; }

/* CONTROLS */
.controls {
    padding:20px;
    display:flex;
    gap:10px;
}

input {
    flex:1;
    padding:12px;
    background:#020617;
    border:1px solid #1e293b;
    color:white;
}

button {
    background:#22c55e;
    border:none;
    padding:12px 20px;
    cursor:pointer;
}

#pdfBtn {
    background:#334155;
    color:#94a3b8;
}

#pdfBtn.active {
    background:#22c55e;
    color:black;
}

/* GRID */
.grid {
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
    padding:20px;
}

/* CARD */
.card {
    background:#020617;
    border:1px solid #1e293b;
    padding:15px;
}

/* LOG */
.logs {
    font-family:monospace;
    font-size:12px;
    max-height:220px;
    overflow:auto;
}

.item {
    padding:6px;
    border-bottom:1px solid #1e293b;
}

.status {
    color:#64748b;
    font-size:12px;
}
</style>
</head>

<body>

<div class="nav">
    <h1>⚡ BBScanner AI Hunter</h1>
</div>

<div class="controls">
    <input id="target" placeholder="example.com">
    <button onclick="startScan()">Scan</button>
    <button id="pdfBtn" onclick="downloadPDF()" disabled>📄 PDF</button>
</div>

<div class="grid">

    <div class="card">
        <h3>🧾 Logs</h3>
        <div id="logs" class="logs"></div>
    </div>

    <div class="card">
        <h3>🌐 Info</h3>
        <div id="info"></div>
    </div>

    <div class="card">
        <h3>🚨 Alerts</h3>
        <div id="alerts"></div>
    </div>

    <div class="card">
        <h3>📊 Vulns</h3>
        <div id="vulns"></div>
    </div>

    <div class="card">
        <h3>🧠 Fuzz</h3>
        <div id="fuzz"></div>
    </div>

</div>

<script>
const socket = io();
let scanDone = false;

function startScan(){
    scanDone = false;

    document.getElementById("pdfBtn").disabled = true;
    document.getElementById("pdfBtn").classList.remove("active");

    socket.emit("start_scan", {
        target: document.getElementById("target").value
    });
}

function downloadPDF(){
    if(!scanDone){
        alert("Espera el scan");
        return;
    }
    window.open("/pdf/" + target.value);
}

socket.on("log", d=>{
    logs.innerHTML += `> ${d.msg}<br>`;
    logs.scrollTop = logs.scrollHeight;

    if(d.msg.includes("Scan completado")){
        scanDone = true;
        let btn = document.getElementById("pdfBtn");
        btn.disabled = false;
        btn.classList.add("active");
    }
});

socket.on("info", d=>{
    info.innerHTML = "IP: " + d.ip;
});

socket.on("ports", d=>{
    info.innerHTML += "<br>Puertos: " + d.length;
});

socket.on("alerts", d=>{
    alerts.innerHTML = d.map(a=>`<div>${a.url}</div>`).join("");
});

socket.on("vulns", d=>{
    vulns.innerHTML = d.map(v=>`<div>${v.name}</div>`).join("");
});

socket.on("fuzz", d=>{
    fuzz.innerHTML = d.map(f=>`<div>${f.url}</div>`).join("");
});
</script>

</body>
</html>
