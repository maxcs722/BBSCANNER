<!DOCTYPE html>
<html>
<head>
<title>BBScanner AI Hunter</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
body {
    margin:0;
    font-family:'Inter', sans-serif;
    background:#0b0f1a;
    color:#e2e8f0;
}

/* LAYOUT */
.container {
    display:flex;
}

/* SIDEBAR */
.sidebar {
    width:220px;
    background:#020617;
    border-right:1px solid #1e293b;
    height:100vh;
    padding:20px;
}

.sidebar h2 {
    color:#22c55e;
    font-size:18px;
}

.sidebar .menu {
    margin-top:20px;
    font-size:13px;
    color:#94a3b8;
}

/* MAIN */
.main {
    flex:1;
}

/* TOPBAR */
.topbar {
    padding:15px 20px;
    border-bottom:1px solid #1e293b;
    display:flex;
    gap:10px;
}

input {
    flex:1;
    padding:10px;
    background:#020617;
    border:1px solid #1e293b;
    color:white;
    border-radius:6px;
}

button {
    background:#22c55e;
    border:none;
    padding:10px 20px;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
}

/* PROGRESS */
.progress-container {
    height:6px;
    background:#1e293b;
}

#progress {
    height:100%;
    width:0%;
    background:#22c55e;
    transition:0.4s;
}

/* GRID */
.grid {
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
    padding:20px;
}

/* CARD */
.card {
    background:#020617;
    border:1px solid #1e293b;
    border-radius:10px;
    padding:15px;
}

.card h3 {
    color:#94a3b8;
    font-size:13px;
}

/* LOGS */
.logs {
    font-family:monospace;
    font-size:12px;
    max-height:200px;
    overflow:auto;
}

/* ITEMS */
.item {
    padding:6px;
    border-bottom:1px solid #1e293b;
}

/* COLORS */
.critical {color:#ef4444;}
.high {color:#f97316;}
.medium {color:#eab308;}
.low {color:#22c55e;}

.status {
    color:#64748b;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="sidebar">
        <h2>⚡ BBScanner</h2>
        <div class="menu">
            Dashboard<br>
            Scans<br>
            Reports<br>
        </div>
    </div>

    <div class="main">

        <div class="topbar">
            <input id="target" placeholder="example.com">
            <button onclick="startScan()">Scan</button>
        </div>

        <div class="progress-container">
            <div id="progress"></div>
        </div>

        <div class="grid">

            <div class="card">
                <h3>🧾 Logs</h3>
                <div id="logs" class="logs"></div>
            </div>

            <div class="card">
                <h3>🌐 Info</h3>
                <div id="info"></div>
            </div>

            <div class="card">
                <h3>🚨 Alerts</h3>
                <div id="alerts"></div>
            </div>

            <div class="card">
                <h3>📊 Vulnerabilidades</h3>
                <div id="vulns"></div>
            </div>

            <div class="card">
                <h3>🧠 Endpoints</h3>
                <div id="fuzz"></div>
            </div>

        </div>

    </div>

</div>

<script>
const socket = io();

function startScan(){
    resetUI();
    socket.emit("start_scan", { target: target.value });
}

function resetUI(){
    logs.innerHTML="";
    info.innerHTML="";
    alerts.innerHTML="";
    vulns.innerHTML="";
    fuzz.innerHTML="";
    progress.style.width = "0%";
}

/* LOGS */
socket.on("log", d=>{
    logs.innerHTML += `> ${d.msg}<br>`;
    logs.scrollTop = logs.scrollHeight;
});

/* PROGRESS */
socket.on("progress", d=>{
    progress.style.width = d.value + "%";
});

/* INFO */
socket.on("info", d=>{
    info.innerHTML = `IP: ${d.ip}`;
});

socket.on("tech", d=>{
    info.innerHTML += `<br>Tech: ${d.join(", ")}`;
});

socket.on("ports", data=>{
    let html = data.map(p=>`
        <div class="item">
        ${p.port} → ${p.service}
        <span class="status">(${p.product || "unknown"})</span>
        </div>
    `).join("");

    info.innerHTML += `<br><br><b>Servicios:</b><br>${html}`;
});

/* VULNS */
socket.on("vulns", d=>{
    vulns.innerHTML = d.length ?
        d.map(v=>`<div class="${v.severity}">[${v.severity}] ${v.name}</div>`).join("")
        : "No vulnerabilities";
});

/* FUZZ */
socket.on("fuzz", d=>{
    fuzz.innerHTML = d.length ?
        d.map(f=>`<div>[${f.status}] ${f.url}</div>`).join("")
        : "No endpoints";
});

/* ALERTS */
socket.on("alerts", d=>{
    alerts.innerHTML = d.length ?
        d.map(a=>`<div class="${a.severity}">[${a.severity}] ${a.url}</div>`).join("")
        : "No alerts";
});
</script>

</body>
</html>
